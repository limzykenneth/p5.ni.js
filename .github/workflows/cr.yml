name: Continuous Release
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    tags:
      - "!**"

permissions: {}

jobs:
  publish:
    if: github.repository == 'limzykenneth/p5.ni.js'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version: "26"
          cache: true

      - name: Build library
        run: vpr build

      - name: Publish library
        run: npx pkg-pr-new publish --commentWithSha
